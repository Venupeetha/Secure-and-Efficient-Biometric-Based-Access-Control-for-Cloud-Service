{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block extra_head %}
<script language="javascript" type='text/javascript'>
function loadFileAsText()
{
  var fileToLoad = document.getElementById("file").files[0];
  var fileReader = new FileReader();
  fileReader.onload = function(fileLoadedEvent)
  {
    var textFromFileLoaded = fileLoadedEvent.target.result;
    document.getElementById("textarea").value = textFromFileLoaded;
  };
  fileReader.readAsText(fileToLoad, "UTF-8");
}
</script>
{% endblock %}
{% block content %}
<h2 class="style12">Upload Data !!! </h2>
<p>&nbsp;</p>
<div class="clr"></div>
<form id="form1" name="form1" method="post" action="{{ url_for('owner_upload1') }}" enctype="multipart/form-data">
<table width="598" border="1" align="center">
  <tr>
    <td width="286" bgcolor="#FFFF00"><span class="style12">Select File :- </span></td>
    <td width="356"><input required="required" type="file" name="t42" id="file" onchange="loadFileAsText()" /></td>
  </tr>
  <tr>
    <td bgcolor="#FFFF00" class="style12">File Name :- </td>
    <td><input required="required" name="tt" type="text" id="t42" size="50" /></td>
  </tr>
  <tr>
    <td bgcolor="#FFFF00">&nbsp;</td>
    <td><textarea name="text" id="textarea" cols="50" rows="15"></textarea></td>
  </tr>
  <tr>
    <td bgcolor="#FFFF00"><span class="style12">Session Key ...... </span></td>
    <td><input name="t4" type="text" id="t4" size="50" value="" readonly="readonly" /></td>
  </tr>
  <tr>
    <td><div align="right"></div></td>
    <td><input type="submit" name="Submit" value="Encrypt" /></td>
  </tr>
</table>
</form>
{% endblock %}
{% block sidebar %}
<div class="gadget">
  <h2 class="star"><span>Sidebar</span> Menu</h2>
  <div class="clr"></div>
  <ul class="sb_menu">
    <li><a href="{{ url_for('owner_main') }}">Home</a></li>
    <li><a href="{{ url_for('logout') }}">Log Out</a></li>
  </ul>
</div>
{% endblock %}
